[package]
name = "video-sync-play"
version = "0.1.0"
edition = "2021"
description = "Watch a video file in step with someone else. One binary, no server, no account."
license = "MIT"
repository = "https://github.com/IceMinisterq/video-sync-play"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = "0.3"
# Already in the tree via tungstenite; named directly so the room code comes
# from the OS CSPRNG on every platform rather than /dev/urandom.
getrandom = "0.2"

[profile.release]
opt-level = 2
strip = true
